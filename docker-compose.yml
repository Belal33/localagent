services:
  # ── Agent sandbox runtime: terminal/workspace environment ─────────────────
  agent_app:
    build:
      context: .
      target: runtime
    container_name: agent_app
    restart: unless-stopped
    volumes:
      - ${AGENT_WORKSPACE:-./workspace}:/workspace
    environment:
      - WORKSPACE_ROOT=/workspace
    command: ["bash", "-lc", "sleep infinity"]

  # ── Legacy containerized app mode: kept for Docker-only deployments ───────
  app-dev:
    profiles: [ "app" ]
    build:
      context: .
      target: dev
    container_name: localagnent_app_dev
    restart: unless-stopped
    ports:
      - "3333:3333"
    volumes:
      - .:/app
      - /app/node_modules
      - ${AGENT_WORKSPACE:-./workspace}:/workspace
    depends_on:
      - agent_app
      - postgres
      - neo4j
      - scrapling-mcp
      - cognee
    env_file:
      - .env.local
    environment:
      - AGENT_RUNNING_IN_DOCKER=true
      - WORKSPACE_ROOT=/workspace
      - AGENT_WORKSPACE=/workspace
      - AGENT_RUNTIME_CONTAINER=agent_app
      - AGENT_RUNTIME_WORKSPACE=/workspace
      - AGENT_PG_URI=postgresql://agent:agent_local_dev@postgres:5432/agent_memory
      - AGENT_NEO4J_URI=bolt://neo4j:7687
      - AGENT_OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_EMBED_URL=http://host.docker.internal:11434/api/embed
      - COGNEE_URL=http://cognee:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"

  app-prod:
    profiles: [ "app" ]
    build:
      context: .
      target: prod
    container_name: localagnent_app_prod
    restart: unless-stopped
    ports:
      - "3333:3333"
    volumes:
      - ${AGENT_WORKSPACE:-./workspace}:/workspace
    depends_on:
      - agent_app
      - postgres
      - neo4j
      - scrapling-mcp
      - cognee
    env_file:
      - .env.local
    environment:
      - AGENT_RUNNING_IN_DOCKER=true
      - WORKSPACE_ROOT=/workspace
      - AGENT_WORKSPACE=/workspace
      - AGENT_RUNTIME_CONTAINER=agent_app
      - AGENT_RUNTIME_WORKSPACE=/workspace
      - AGENT_PG_URI=postgresql://agent:agent_local_dev@postgres:5432/agent_memory
      - AGENT_NEO4J_URI=bolt://neo4j:7687
      - AGENT_OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_EMBED_URL=http://host.docker.internal:11434/api/embed
      - COGNEE_URL=http://cognee:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── PostgreSQL + pgvector ─────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agent_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent_local_dev
      POSTGRES_DB: agent_memory
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql

  # ── Neo4j (knowledge graph) ──────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: agent_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # Browser UI
      - "7687:7687" # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/agent_local_dev
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4jdata:/data

  # ── Scrapling MCP (web scraping service) ─────────────────────────────────
  scrapling-mcp:
    image: ghcr.io/d4vinci/scrapling:latest
    container_name: agent_scrapling_mcp
    command: mcp --http --host 0.0.0.0 --port 8931
    restart: unless-stopped
    ports:
      - "8931:8931"
    healthcheck:
      test: [ "CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost', 8931), timeout=5); s.close()" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ── Cognee AI Memory Engine ─────────────────────────────────────────────
  cognee:
    image: cognee/cognee:latest
    container_name: agent_cognee
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - cogneedata:/app/cognee/.data_storage
    env_file:
      - .env.local
    environment:
      # ─── LLM (uses OpenCode custom endpoint) ─────────
      # LLM_API_KEY is loaded from .env.local (env_file above)
      - LLM_PROVIDER=custom
      - LLM_MODEL=openai/minimax-m2.5
      - LLM_ENDPOINT=https://opencode.ai/zen/go/v1
      - COGNEE_SKIP_CONNECTION_TEST=true
      # ─── Embeddings (uses local Ollama) ──────────────
      - EMBEDDING_PROVIDER=ollama
      - EMBEDDING_MODEL=mxbai-embed-large:latest
      - EMBEDDING_ENDPOINT=http://host.docker.internal:11434/api/embed
      - EMBEDDING_DIMENSIONS=1024
      - HUGGINGFACE_TOKENIZER=mixedbread-ai/mxbai-embed-large-v1
      - VECTOR_DB_PROVIDER=pgvector
      - VECTOR_DB_URL=postgresql://agent:agent_local_dev@postgres:5432/agent_memory
      - GRAPH_DATABASE_PROVIDER=neo4j
      - GRAPH_DATABASE_URL=bolt://neo4j:7687
      - GRAPH_DATABASE_USERNAME=neo4j
      - GRAPH_DATABASE_PASSWORD=agent_local_dev
      # Use Postgres for internal relational state (fixes sqlite3 error)
      - DB_PROVIDER=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=agent
      - DB_PASSWORD=agent_local_dev
      - DB_NAME=agent_memory
      - ENABLE_BACKEND_ACCESS_CONTROL=false
      - REQUIRE_AUTHENTICATION=false
    depends_on:
      - postgres
      - neo4j
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
  neo4jdata:
  cogneedata:
