services:
  # ── Dev mode: hot-reload with source mounted ──────────────────────────────
  app-dev:
    profiles: [ "dev" ]
    build:
      context: .
      target: dev
    container_name: agent_app
    restart: unless-stopped
    ports:
      - "3333:3333"
    volumes:
      - .:/app # source code for hot reload
      - /app/node_modules # preserve container node_modules
      - ${AGENT_WORKSPACE:-/home/agent_worker/workspace}:/workspace # agent sandbox
    depends_on:
      - postgres
      - neo4j
      - scrapling-mcp
    env_file:
      - .env.local
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Prod mode: built image ────────────────────────────────────────────────
  app-prod:
    profiles: [ "prod" ]
    build:
      context: .
      target: prod
    container_name: agent_app_prod
    restart: unless-stopped
    ports:
      - "3333:3333"
    volumes:
      - ${AGENT_WORKSPACE:-/home/agent_worker/workspace}:/workspace
    depends_on:
      - postgres
      - neo4j
      - scrapling-mcp
    env_file:
      - .env.local
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── PostgreSQL + pgvector ─────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agent_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent_local_dev
      POSTGRES_DB: agent_memory
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql

  # ── Neo4j (knowledge graph) ──────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: agent_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # Browser UI
      - "7687:7687" # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/agent_local_dev
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4jdata:/data

  # ── Scrapling MCP (web scraping service) ─────────────────────────────────
  scrapling-mcp:
    image: ghcr.io/d4vinci/scrapling:latest
    container_name: agent_scrapling_mcp
    command: mcp --http --host 0.0.0.0 --port 8931
    restart: unless-stopped
    ports:
      - "8931:8931"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8931/mcp')" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
  neo4jdata:
